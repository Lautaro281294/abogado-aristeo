  <link rel="icon" type="image/x-icon" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="theme-color" content="#1A1A1A">
  
  <title>Contacto | Estudio Jurídico Aristeo</title>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LegalService",
    "name": "Estudio Jurídico Aristeo",

      "@type": "PostalAddress",

  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
  :root {
    --bg-base: #080a06; --bg-surface: #0e120a; --bg-panel: #13180e;
    --line-color: rgba(194, 163, 109, 0.15); --gold-main: #c2a36d;
    --gold-light: #e3c999; --gold-dark: #8a7346; --text-main: #F7F5F0;
    --text-muted: rgba(247, 245, 240, 0.7); --font-heading: 'Cormorant Garamond', Georgia, serif;
    --font-body: 'DM Sans', system-ui, sans-serif; --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; font-size: 16px; }
  html, body { background-color: var(--bg-base); color: var(--text-main); font-family: var(--font-body); font-weight: 300; line-height: 1.85; overflow-x: hidden; width: 100%; }
  
  .container { max-width: 1350px; margin: 0 auto; padding: 0 5vw; }
  .header { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; padding: 2.2rem 0; background: transparent; transition: 0.5s; }
  .header.scrolled { background: rgba(8, 10, 6, 0.98); backdrop-filter: blur(10px); padding: 1.2rem 0; border-bottom: 1px solid var(--line-color); }
  .nav-wrap { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 1rem; }
  
  .brand { text-decoration: none; display: flex; flex-direction: column; }
  .brand-top { font-size: 0.5rem; letter-spacing: 0.5em; text-transform: uppercase; color: var(--gold-main); font-weight: 600; }
  .brand-name { font-family: var(--font-heading); font-size: 1.6rem; color: var(--text-main); text-transform: uppercase; }
  
  .nav-links { display: flex; gap: 3rem; align-items: center; }
  .nav-a { font-size: 0.75rem; text-transform: uppercase; color: var(--text-main); text-decoration: none; }
  .btn-header { color: var(--bg-base); background: var(--gold-main); padding: 0.9rem 2rem; text-decoration: none; font-size: 0.7rem; font-weight: 600; }
  
  .page-hero { padding: 14rem 0 6rem; background: linear-gradient(180deg, var(--bg-surface) 0%, var(--bg-base) 100%); text-align: center; }
  .ph-title { font-family: var(--font-heading); font-size: 4rem; color: var(--text-main); margin-bottom: 1.5rem; }
  
  .contact-wrap { display: grid; grid-template-columns: 40% 60%; border: 1px solid var(--line-color); background: var(--bg-surface); margin-top: 2rem; }
  .contact-left { padding: 5rem; background: var(--bg-panel); border-right: 1px solid var(--line-color); }
  .contact-right { padding: 5rem; }
  .fi { width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--line-color); color: var(--text-main); padding: 1rem 0; outline: none; }
  .btn-sub { padding: 1.5rem; background: transparent; border: 1px solid var(--gold-main); color: var(--gold-main); width: 100%; cursor: pointer; text-transform: uppercase; }
  
  @media (max-width: 900px) { .contact-wrap { grid-template-columns: 1fr; } .nav-links { display: none; } }
  </style>
</head>
<body>

<header class="header" id="hdr">
  <div class="container nav-wrap">
    <a href="/index.html" class="brand">
      <span class="brand-top">Estudio Jurídico</span>
      <span class="brand-name">Aristeo</span>
    </a>
    <nav class="nav-links">
      <a href="/index.html" class="nav-a">Inicio</a>
      <a href="/contacto.html" class="btn-header">Contactame</a>
    </nav>
  </div>
</header>

<section class="page-hero">
  <div class="container">
    <h1 class="ph-title">Comunicación Directa</h1>
    <p>Inicie la evaluación técnica de su caso.</p>
  </div>
</section>

<section class="container">
  <div class="contact-wrap">
    <div class="contact-left">
      <h3>Vías de Contacto</h3>
      <a href="https://wa.me/5493517736170" class="channel" style="display:block; padding:2rem; border:1px solid var(--line-color); color:white; text-decoration:none;">
        WhatsApp Business <i class="fa-brands fa-whatsapp"></i>
      </a>
    </div>
    <div class="contact-right">
      <form id="evalForm">
        <div class="fg"><label class="fl">Nombre *</label><input type="text" id="fn" class="fi" required></div>
        <div class="fg"><label class="fl">Celular *</label><input type="tel" id="ft" class="fi" required></div>
        <div class="fg"><label class="fl">Resumen del caso *</label><textarea id="fs" class="fi" required></textarea></div>
        <button type="button" class="btn-sub" onclick="enviar('wsp')">Enviar por WhatsApp</button>
      </form>
    </div>
  </div>
</section>

<script>
  async function enviar(metodo) {
    const nom = document.getElementById('fn').value;
    const tel = document.getElementById('ft').value;
    const res = document.getElementById('fs').value;
    let msg = `Consulta: ${nom}, Tel: ${tel}, Caso: ${res}`;
    window.open(`https://wa.me/5493517736170?text=${encodeURIComponent(msg)}`);
  }
</script>
</body>
</html>
