<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Contacto directo con el Dr. Lautaro N. Aristeo. Evaluación técnica de casos legales en Córdoba. Vías de comunicación y cuestionario de pre-consulta."/>
  <meta name="author" content="Dr. Lautaro Nahuel Aristeo">
  <title>Contacto | Estudio Jurídico Aristeo</title>

  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
  /* ════ SISTEMA DE DISEÑO (OLIVA) ════ */
  :root {
    --bg-base:     #161913; 
    --bg-surface:  #1f241a; 
    --bg-panel:    #292f22; 
    --line-color:  rgba(194, 163, 109, 0.15); 
    --line-hover:  rgba(194, 163, 109, 0.35);
    
    --gold-main:   #c2a36d; 
    --gold-light:  #e3c999; 
    --gold-dark:   #8a7346; 
    
    --text-main:   #F7F5F0; 
    --text-muted:  rgba(247, 245, 240, 0.75); 
    
    --font-heading: 'Cormorant Garamond', Georgia, serif;
    --font-body:    'DM Sans', system-ui, sans-serif;
    
    --ease:         cubic-bezier(0.16, 1, 0.3, 1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; font-size: 16px; }
  body { background-color: var(--bg-base); color: var(--text-main); font-family: var(--font-body); font-weight: 300; line-height: 1.85; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  ::selection { background-color: var(--gold-dark); color: var(--text-main); }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg-base); }
  ::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 3px; }

  .container { max-width: 1350px; margin: 0 auto; padding: 0 5vw; }
  .section { padding: 8rem 0; position: relative; }

  .label { display: inline-flex; align-items: center; gap: 1rem; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold-main); margin-bottom: 2rem; }
  .label::before { content: ''; width: 40px; height: 1px; background: var(--gold-main); flex-shrink: 0; }
  .heading-2 { font-family: var(--font-heading); font-size: clamp(2.8rem, 4.5vw, 4.2rem); font-weight: 400; line-height: 1.1; color: var(--text-main); margin-bottom: 2.5rem; }
  .heading-2 em { font-style: italic; color: var(--gold-light); }

  .reveal { opacity: 0; transform: translateY(30px); transition: 0.8s var(--ease); }
  .reveal.in { opacity: 1; transform: translateY(0); }

  /* ════ HEADER Y RESPONSIVO ════ */
  .header { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; padding: 2.2rem 0; transition: all 0.5s var(--ease); }
  .header.scrolled { background: rgba(22, 25, 19, 0.98); backdrop-filter: blur(15px); padding: 1.2rem 0; border-bottom: 1px solid var(--line-color); }
  .nav-wrap { display: flex; align-items: center; justify-content: space-between; gap: 2rem; }
  
  .brand { text-decoration: none; flex-shrink: 0; display: flex; flex-direction: column; }
  .brand-top { font-size: 0.75rem; letter-spacing: 0.4em; text-transform: uppercase; color: var(--gold-main); font-weight: 600; margin-bottom: 2px; }
  .brand-name { font-family: var(--font-heading); font-size: 2.2rem; font-weight: 500; letter-spacing: 0.15em; color: var(--text-main); text-transform: uppercase; transition: color 0.3s; }
  .brand:hover .brand-name { color: var(--gold-light); }

  /* Elemento Hamburguesa Oculto en PC */
  .menu-toggle { display: none; font-size: 1.8rem; color: var(--gold-main); cursor: pointer; transition: 0.3s; }

  .nav-links { display: flex; gap: 3rem; align-items: center; justify-content: flex-end; }
  .nav-a { font-size: 0.75rem; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-main); text-decoration: none; transition: 0.3s; position: relative; padding: 5px 0; }
  .nav-a::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 1px; background: var(--gold-main); transition: width 0.3s var(--ease); }
  .nav-a:hover { color: var(--gold-light); }
  .nav-a:hover::after { width: 100%; }

  .drop { position: relative; display: flex; align-items: center; padding: 10px 0; }
  .drop-menu { position: absolute; top: 100%; left: 50%; transform: translateX(-50%) translateY(15px); background: var(--bg-surface); border: 1px solid var(--line-color); padding: 1.2rem 0; min-width: 280px; opacity: 0; visibility: hidden; transition: 0.4s var(--ease); box-shadow: 0 30px 60px rgba(0,0,0,0.8); }
  .drop:hover .drop-menu { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
  .drop-item { display: flex; align-items: center; gap: 1rem; padding: 0.8rem 2.5rem; font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.15em; text-decoration: none; transition: 0.3s; border-left: 2px solid transparent; }
  .drop-item i { font-size: 0.8rem; color: var(--gold-dark); transition: 0.3s; }
  .drop-item:hover { background: var(--bg-panel); color: var(--gold-light); border-left-color: var(--gold-main); padding-left: 3rem; }
  .drop-item:hover i { color: var(--gold-main); }

  .btn-header { display: inline-flex; align-items: center; gap: 12px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: var(--bg-base); background: var(--gold-main); padding: 1rem 2.2rem; text-decoration: none; transition: 0.4s; border: 1px solid var(--gold-main); flex-shrink: 0; }
  .btn-header:hover { background: transparent; color: var(--gold-main); }

  /* AJUSTES PARA CELULARES */
  @media (max-width: 950px) {
    .menu-toggle { display: block; z-index: 1100; position: relative; }
    
    .nav-links {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
      background: rgba(22, 25, 19, 0.98); backdrop-filter: blur(15px);
      flex-direction: column; justify-content: center; align-items: center;
      opacity: 0; visibility: hidden; transition: 0.4s var(--ease); z-index: 1050;
    }
    .nav-links.active { opacity: 1; visibility: visible; }
    
    .drop { flex-direction: column; text-align: center; }
    .drop-menu { 
      position: relative; top: auto; left: auto; transform: none; 
      background: transparent; border: none; box-shadow: none; 
      min-width: auto; padding: 1rem 0 0; display: none; 
    }
    .drop.open .drop-menu { display: flex; flex-direction: column; gap: 0.5rem; opacity: 1; visibility: visible; }
    
    .brand-name { font-size: 1.8rem; }
  }

  /* ════ HERO INTERNO ════ */
  .page-hero { padding: 12rem 0 6rem; background: linear-gradient(180deg, var(--bg-surface) 0%, var(--bg-base) 100%); text-align: center; border-bottom: 1px solid var(--line-color); }
  .ph-icon { font-size: 3.5rem; color: var(--gold-main); margin-bottom: 1.5rem; }
  .ph-title { font-family: var(--font-heading); font-size: clamp(3rem, 6vw, 4.5rem); font-weight: 400; color: var(--text-main); margin-bottom: 1.5rem; line-height: 1.1;}
  .ph-desc { font-size: 1.15rem; color: var(--text-muted); max-width: 800px; margin: 0 auto; line-height: 1.8;}

  /* Ajuste Hero para Celulares */
  @media (max-width: 950px) {
    .page-hero { padding-top: 10rem; }
  }

  /* ════ ESTRUCTURA DE CONTACTO DUAL ════ */
  .contact-wrap { display: grid; grid-template-columns: 40% 60%; border: 1px solid var(--line-color); background: var(--bg-surface); margin-top: 2rem; box-shadow: 0 40px 80px rgba(0,0,0,0.4); }
  @media (max-width: 1000px) { .contact-wrap { grid-template-columns: 1fr; } }
  
  /* Panel Vías Rápidas */
  .contact-left { padding: 5rem 4.5rem; background: var(--bg-panel); border-right: 1px solid var(--line-color); display: flex; flex-direction: column; justify-content: space-between; }
  .contact-left h3 { font-family: var(--font-heading); font-size: 2.2rem; font-weight: 400; margin-bottom: 1.5rem; color: var(--text-main); }
  .contact-left p { font-size: 1.05rem; color: var(--text-muted); margin-bottom: 3rem; line-height: 1.8; }
  
  .channel { display: flex; align-items: center; justify-content: space-between; padding: 2.2rem; border: 1px solid var(--line-color); margin-bottom: 1.5rem; text-decoration: none; transition: 0.4s var(--ease); background: var(--bg-surface); position: relative; overflow: hidden; }
  .channel::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--gold-main); transform: scaleY(0); transform-origin: bottom; transition: transform 0.4s var(--ease); }
  .channel:hover { border-color: var(--line-hover); transform: translateX(12px); background: var(--bg-base); }
  .channel:hover::before { transform: scaleY(1); }
  
  .ch-l { display: flex; align-items: center; gap: 1.8rem; }
  .ch-l i { font-size: 2.2rem; color: var(--gold-main); }
  .ch-tag { display: block; font-size: 0.65rem; text-transform: uppercase; color: var(--gold-main); letter-spacing: 0.25em; margin-bottom: 6px; }
  .ch-name { font-size: 1.15rem; color: var(--text-main); font-weight: 400; }

  .urgency-alert { margin-top: 4rem; padding: 2.5rem; background: rgba(194, 163, 109, 0.05); border-left: 2px solid var(--gold-main); }
  .urgency-alert strong { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--gold-light); margin-bottom: 0.8rem; }
  .urgency-alert p { font-size: 0.95rem; color: var(--text-muted); line-height: 1.7; margin: 0; }

  /* Panel Formulario Inteligente */
  .contact-right { padding: 5rem; }
  @media (max-width: 600px) { .contact-right { padding: 3rem 2rem; } }
  .form-eyebrow { font-size: 0.75rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold-main); display: block; margin-bottom: 3.5rem; font-weight: 600; }
  
  .fg { margin-bottom: 3rem; }
  .fl { display: block; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; color: var(--gold-main); margin-bottom: 1.2rem; letter-spacing: 0.25em; }
  .fi { width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--line-color); color: var(--text-main); font-family: var(--font-body); font-size: 1.15rem; padding: 1rem 0; outline: none; transition: 0.4s; appearance: none; border-radius: 0; }
  .fi:focus { border-color: var(--gold-main); }
  .fi option { background: var(--bg-panel); color: var(--text-main); }
  .frow { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; }
  @media (max-width: 600px) { .frow { grid-template-columns: 1fr; gap: 0; } }

  /* Caja Dinámica */
